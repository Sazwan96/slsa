### What you need on the app side

**1. RSpec + SimpleCov**

`Gemfile`:
```ruby
group :test do
  gem "rspec-rails"
  gem "simplecov", require: false
end
```

`spec/spec_helper.rb` (top of the file, before anything else loads Rails):
```ruby
require "simplecov"
SimpleCov.start "rails"
```

**2. Codecov secret**

Add `CODECOV_TOKEN` in **Repo → Settings → Secrets and variables → Actions**. If your repo is public you can drop the `token:` line.

**3. Redis (Action Cable / Sidekiq / cache)**

If you don't use Redis, delete the `redis` service and the `REDIS_URL` env var. If you do use it, make sure `config/environments/test.rb` points at `ENV["REDIS_URL"]`.

