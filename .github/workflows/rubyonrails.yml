Adding the next layer: a **Docker build & push to GHCR** job and a **Kamal deploy** job (Rails' default deploy tool since Rails 7.1). I'll also add a **Slack notification** on failure. Remove what you don't use.

```yaml
name: "Ruby on Rails CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # TEST
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3" ]
    services:
      postgres:
        image: postgres:16-alpine
        ports: [ "5432:5432" ]
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@78c01b705fd9d5ad960d432d3a0cfa341d50e410 # v1.179.1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Run RSpec
        run: bundle exec rspec
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/.resultset.json
          fail_ci_if_error: false

  # ---------------------------------------------------------------
  # LINT & SECURITY
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@78c01b705fd9d5ad960d432d3a0cfa341d50e410 # v1.179.1
        with:
          bundler-cache: true
      - run: bundle binstubs bundler-audit brakeman rubocop
      - run: bin/bundler-audit --update
      - run: bin/brakeman -q -w2
      - run: bin/rubocop --parallel

  # ---------------------------------------------------------------
  # BUILD & PUSH DOCKER IMAGE (main only)
  # ---------------------------------------------------------------
  build:
    needs: [ test, lint ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ---------------------------------------------------------------
  # DEPLOY VIA KAMAL (main only)
  # ---------------------------------------------------------------
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com   # <-- change to your real URL
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@78c01b705fd9d5ad960d432d3a0cfa341d50e410 # v1.179.1
        with:
          bundler-cache: true

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/kamal deploy

  # ---------------------------------------------------------------
  # NOTIFY ON FAILURE
  # ---------------------------------------------------------------
  notify:
    needs: [ test, lint, build, deploy ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on `${{ github.repository }}` (${{ github.ref_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
```

### New secrets to configure

**Repo → Settings → Secrets and variables → Actions:**

| Secret | Purpose |
|---|---|
| `CODECOV_TOKEN` | Coverage upload (skip if public repo). |
| `SSH_PRIVATE_KEY` | Private key that can SSH into your deploy host. |
| `DEPLOY_HOST` | Hostname or IP of your server (for `ssh-keyscan`). |
| `RAILS_MASTER_KEY` | Contents of `config/master.key`. |
| `SLACK_WEBHOOK_URL` | Incoming webhook URL from Slack. |

### Kamal prerequisites

Your repo needs a `config/deploy.yml` (generated by `bin/kamal init`) and a `Dockerfile` (Rails 7.1+ ships one by default). Kamal reads image name/tag from `deploy.yml`, so make sure it matches `${REGISTRY}/${IMAGE_NAME}` — otherwise the deploy job will pull the wrong tag.

Minimal `config/deploy.yml` snippet:
```yaml
image: ghcr.io/<your-user>/<your-repo>
servers:
  web:
    - <deploy-host-ip>
registry:
  server: ghcr.io
  username: <your-github-username>
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  secret:
    - RAILS_MASTER_KEY
```

### How the pipeline flows

```
push to main ─▶ test ─┐
                      ├─▶ build (GHCR) ─▶ deploy (Kamal) ─▶ ✅
              lint ───┘                              └─▶ notify on failure
```

- PRs only run `test` and `lint` (no build/deploy).
- `main` runs everything and ships to production.
- Any failure triggers the Slack job.

### Swapping pieces

- **Heroku instead of Kamal** → replace the `deploy` job body with `akhileshns/heroku-deploy@v3.13.12` and set `HEROKU_API_KEY` / `HEROKU_APP_NAME`.
- **Fly.io instead of Kamal** → use `superfly/flyctl-actions/setup-flyctl@master` + `flyctl deploy --remote-only`.
- **Render instead of Kamal** → just a `curl` to a deploy hook URL.
- **No Slack** → drop the `notify` job.
- **No GHCR** → drop the `build` job and let Kamal build on the server (`bin/kamal deploy` with local registry disabled).

