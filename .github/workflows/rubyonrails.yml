### What changed and why

| Change | Reason |
|---|---|
| `postgres:16-alpine` | PostgreSQL 11 is EOL; 16 is current and supported. |
| `options: --health-cmd pg_isready ...` | Prevents Rails from connecting before Postgres is ready. |
| `concurrency` block | Cancels in‑progress runs when you push again quickly, saving CI minutes. |
| `bin/rails db:test:prepare` | More reliable than `db:schema:load` for creating/loading the test DB (works with both `schema.rb` and `structure.sql`). |
| `bin/rails test` | Explicit test runner instead of relying on the default Rake task. Replace with `bundle exec rspec` if you use RSpec. |

